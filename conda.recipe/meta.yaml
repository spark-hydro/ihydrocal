{% set name = "ihydrocal" %}
{% set version = "0.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - ihydrocal = ihydrocal.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=3.9
    - numpy >=1.26.0
    - pandas >=2.0.0
    - matplotlib-base >=3.8.0
    - scipy >=1.11.0
    - pyyaml >=6.0.0
    - pyemu >=1.2.0
    - flopy >=3.3.5

test:
  imports:
    - ihydrocal
  commands:
    - ihydrocal --help

about:
  home: https://github.com/yourusername/ihydrocal
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Integrated Hydrological Model Calibration and Uncertainty Analysis
  description: |
    iHydroCal provides a unified framework for calibration and uncertainty 
    analysis of integrated hydrological models including SWAT, SWAT+, 
    SWAT-MODFLOW, and APEX-MODFLOW-RT3D systems.
  dev_url: https://github.com/yourusername/ihydrocal

extra:
  recipe-maintainers:
    - yourusername